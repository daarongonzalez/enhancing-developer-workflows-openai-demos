<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shop our delicious cheesecakes - Bethany's Pie Shop">
  <title>Shop Cheesecakes - Bethany's Pie Shop</title>
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/cart.css" rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <div class="site-header-wrapper">
      <h1><a href="/"><img src="/img/logo.png" alt="Bethany's Pie Shop Logo" /></a></h1>
      <nav>
        <ul>
          <li><a class="shop-dropdown" href="#">Shop <span>&#8964;</span></a>
            <ul id="hover-menu">
              <li><a href="#">Seasonal Pies</a></li>
              <li><a href="#">Fruit Pies</a></li>
              <li><a href="/shop">Cheesecakes</a></li>
              <li><a href="#">All Pies</a></li>
            </ul>
          </li>
          <li><a href="/contact">Contact</a></li>
          <li><a href="#">Register</a></li>
        </ul>
      </nav>
      <div class="header-icons">
        <ul>
          <li><a href="#" aria-label="Search"><img src="/img/search-icon.png" alt="search icon" /></a></li>
          <li><a href="#" aria-label="Profile"><img src="/img/profile-icon.png" alt="profile icon" /></a></li>
          <li><a href="/cart" aria-label="Shopping Cart"><img src="/img/cart-icon.png" alt="shopping cart icon" /></a></li>
        </ul>
      </div>
    </div>
  </header>
  <section class="main-content">
    <h2>Cheesecakes<hr /></h2>
    <div class="gallery-wrapper">
      <div class="pie-item">
        <img src="/img/cheesecake-1.png" alt="image of Original Cheesecake" />
        <div class="add-to-cart">
          <p><button class="add-to-cart-btn" data-product-id="original-cheesecake">+ Add to cart</button></p>
        </div>
        <div class="pie-info">
          <h4>Original Cheesecake</h4>
          <p>$18.95</p>
        </div>
      </div>
      <div class="pie-item">
        <img src="/img/cheesecake-2.png" alt="image of Strawberry Cheesecake" />
        <div class="add-to-cart">
          <p><button class="add-to-cart-btn" data-product-id="strawberry-cheesecake">+ Add to cart</button></p>
        </div>
        <div class="pie-info">
          <h4>Strawberry Cheesecake</h4>
          <p>$18.95</p>
        </div>
      </div>
      <div class="pie-item">
        <img src="/img/cheesecake-3.png" alt="image of Chocolate Cheesecake" />
        <div class="add-to-cart">
          <p><button class="add-to-cart-btn" data-product-id="chocolate-cheesecake">+ Add to cart</button></p>
        </div>
        <div class="pie-info">
          <h4>Chocolate Cheesecake</h4>
          <p>$18.95</p>
        </div>
      </div>
      <div class="pie-item">
        <img src="/img/cheesecake-4.png" alt="image of Birthday Cheesecake" />
        <div class="add-to-cart">
          <p><button class="add-to-cart-btn" data-product-id="birthday-cheesecake">+ Add to cart</button></p>
        </div>
        <div class="pie-info">
          <h4>Birthday Cheesecake</h4>
          <p>$18.95</p>
        </div>
      </div>
      <div class="pie-item">
        <img src="/img/cheesecake-5.png" alt="image of Caramel Cheesecake" />
        <div class="add-to-cart">
          <p><button class="add-to-cart-btn" data-product-id="caramel-cheesecake">+ Add to cart</button></p>
        </div>
        <div class="pie-info">
          <h4>Caramel Cheesecake</h4>
          <p>$18.95</p>
        </div>
      </div>
      <div class="pie-item">
        <img src="/img/cheesecake-6.png" alt="image of Pistachio Cheesecake" />
        <div class="add-to-cart">
          <p><button class="add-to-cart-btn" data-product-id="pistachio-cheesecake">+ Add to cart</button></p>
        </div>
        <div class="pie-info">
          <h4>Pistachio Cheesecake</h4>
          <p>$18.95</p>
        </div>
      </div>
    </div>
  </section>
  <script src="/js/products.js"></script>
  <script src="/js/cart-storage.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/dropdown.js"></script>
  <script>
    // Add to cart button event listeners
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('.add-to-cart-btn').forEach(button => {
        button.addEventListener('click', function(e) {
          e.preventDefault();
          const productId = this.dataset.productId;
          const product = getProductById(productId);
          
          if (product) {
            // Add loading state
            this.classList.add('loading');
            this.textContent = 'Adding...';
            
            // Simulate slight delay for better UX
            setTimeout(() => {
              try {
                cart.addItem(productId, 1);
                cart.showAddToCartNotification(product.name);
              } catch (error) {
                console.error('Error adding to cart:', error);
              } finally {
                // Remove loading state
                this.classList.remove('loading');
                this.textContent = '+ Add to cart';
              }
            }, 300);
          }
        });
      });
    });
  </script>
</body>

</html>
