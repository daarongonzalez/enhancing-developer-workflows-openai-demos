<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shopping cart - Bethany's Pie Shop">
  <title>Shopping Cart - Bethany's Pie Shop</title>
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/cart.css" rel="stylesheet">

  <script type="text/javascript">
    window.onload = () => {
      let submit_button = document.querySelector('#submit')
      if (submit_button) {
        submit_button.addEventListener('click', (event) => {
          event.preventDefault()

          // redirect to shipping.html when the checkout button is pressed to simulate a checkout flow
          window.open('/shipping','_self')
        }, false)
      }
    }
  </script>
</head>

<body>
  <header class="site-header">
    <div class="site-header-wrapper">
      <h1><a href="/"><img src="/img/logo.png" alt="Bethany's Pie Shop Logo" /></a></h1>
      <nav>
        <ul>
          <li><a class="shop-dropdown" href="#">Shop <span>&#8964;</span></a>
            <ul id="hover-menu">
              <li><a href="#">Seasonal Pies</a></li>
              <li><a href="#">Fruit Pies</a></li>
              <li><a href="/shop">Cheesecakes</a></li>
              <li><a href="#">All Pies</a></li>
            </ul>
          </li>
          <li><a href="/contact">Contact</a></li>
          <li><a href="#">Register</a></li>
        </ul>
      </nav>
      <div class="header-icons">
        <ul>
          <li><a href="#" aria-label="Search"><img src="/img/search-icon.png" alt="search icon" /></a></li>
          <li><a href="#" aria-label="Profile"><img src="/img/profile-icon.png" alt="profile icon" /></a></li>
          <li><a href="/cart" aria-label="Shopping Cart"><img src="/img/cart-icon.png" alt="shopping cart icon" /></a></li>
        </ul>
      </div>
    </div>
  </header>
  <section class="main-content">
    <h2>Shopping Cart<hr /></h2>
    <div class="cart-wrapper">
      <!-- Dynamic cart items container -->
      <div class="cart-items-wrapper">
        <!-- Cart items populated by JavaScript -->
      </div>
      <!-- Dynamic pricing container -->
      <div class="subtotal-wrapper">
        <form>
          <div class="row">
            <p>Subtotal</p>
            <p>$0.00</p>
          </div>
          <div class="row">
            <p>Shipping</p>
            <p>$0.00</p>
          </div>
          <div class="row">
            <p>Sales Tax</p>
            <p>$0.00</p>
          </div>
          <div class="row">
            <hr />
          </div>
          <div class="row">
            <p>Estimated Total</p>
            <p>$0.00</p>
          </div>
          <div class="row">
            <hr>
          </div>
          <div class="row">
            <input type="text" name="discount-code" id="discount-code" placeholder="Discount code or gift card" aria-label="Discount code or gift card" />
            <button type="button">Apply</button>
          </div>
          <div class="row">
            <hr>
          </div>
          <div class="row">
              <input type="submit" name="submit" id="submit" value="Checkout" />
          </div>
        </form>
      </div>
    </div>
  </section>
  <!-- Script loading order is important for cart functionality -->
  <script src="/js/products.js"></script>      <!-- Product database -->
  <script src="/js/cart-storage.js"></script>  <!-- Cart storage -->
  <script src="/js/cart.js"></script>          <!-- Cart functionality -->
  <script src="/js/dropdown.js"></script>      <!-- Navigation dropdown -->
</body>

</html>
