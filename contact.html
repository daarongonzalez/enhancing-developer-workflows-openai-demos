<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact Bethany's Pie Shop - Get in touch with us">
  <title>Contact Us - Bethany's Pie Shop</title>
  <link href="/css/main.css" rel="stylesheet">
  <link href="/css/cart.css" rel="stylesheet">
</head>

<body>
  <header class="site-header">
    <div class="site-header-wrapper">
      <h1><a href="/"><img src="/img/logo.png" alt="Bethany's Pie Shop Logo" /></a></h1>
      <nav>
        <ul>
          <li><a class="shop-dropdown" href="#">Shop <span>&#8964;</span></a>
            <ul id="hover-menu">
              <li><a href="#">Seasonal Pies</a></li>
              <li><a href="#">Fruit Pies</a></li>
              <li><a href="/shop">Cheesecakes</a></li>
              <li><a href="#">All Pies</a></li>
            </ul>
          </li>
          <li><a href="/contact">Contact</a></li>
          <li><a href="#">Register</a></li>
        </ul>
      </nav>
      <div class="header-icons">
        <ul>
          <li><a href="#" aria-label="Search"><img src="/img/search-icon.png" alt="search icon" /></a></li>
          <li><a href="#" aria-label="Profile"><img src="/img/profile-icon.png" alt="profile icon" /></a></li>
          <li><a href="/cart" aria-label="Shopping Cart"><img src="/img/cart-icon.png" alt="shopping cart icon" /></a></li>
        </ul>
      </div>
    </div>
  </header>
  <section class="main-content">
    <h2>Contact us<hr /></h2>
    <div class="contact-wrapper">
      <div class="image-wrapper">
        <img src="/img/contact.png" alt="image of person sticking a fork in a piece of pie" />
      </div>
      <div class="form-wrapper">
        <h3>We'd Love to Hear from You</h3>
        <p>Please fill out the form below to let us know how we can help.</p>
        <fieldset>
          <form>
            <label for="full_name">Full name</label>
            <input type="text" id="full_name" name="full_name" value="" required />
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="" required />
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" value="" />
            <label for="comment">Comment</label>
            <textarea id="comment" name="comment" required></textarea>
            <input type="submit" name="submit" id="submit" value="Submit" />
          </form>
        </fieldset>
      </div>
    </div>
  </section>
  <script src="/js/products.js"></script>
  <script src="/js/cart-storage.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/dropdown.js"></script>
</body>

</html>
